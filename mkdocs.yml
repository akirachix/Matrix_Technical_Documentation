site_name: SecureReader Technical Documentation
site_description: Technical documentation for the SecureReader project

repo_url: https://github.com/akirachix/Matrix_Technical_Documentation
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Overview: overview/index.md
  - Architecture: architecture/index.md
  - Frontend Web: frontend/index.md
  - Chrome Extension: chrome-extension/index.md
  - Backend: backend/index.md
  - AI: ai/index.md
  - Developer Guide: developer-guide/index.md
